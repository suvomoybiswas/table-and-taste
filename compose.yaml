services:
  backend:
    build:
      context: ./backend
    image: table-and-taste-backend:local
    container_name: table-and-taste-backend
    env_file:
      - ./backend/.env
    ports:
      - "8080:8080"
  frontend:
    image: table-and-taste-frontend:local
    container_name: table-and-taste-frontend
    ports:
      - "3000:80"

    build:
      context: ./frontend

